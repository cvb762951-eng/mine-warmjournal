<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗夜琉璃 — 高级主题预览</title>
<style>
/* ============================================================
   暗夜琉璃 — 深色高级感主题
   「一眼惊艳」—— 深邃如夜，琉璃如镜，荧光如星
   ============================================================ */

:root {
  /* 基础：暗夜系统 */
  --night: #0A0A0F;
  --night-soft: #12121A;
  --night-card: #1A1A25;
  --night-elevated: #22222F;

  /* 琉璃：半透明质感 */
  --glass: rgba(255, 255, 255, 0.04);
  --glass-strong: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-strong: rgba(255, 255, 255, 0.12);

  /* 荧光：翡翠 */
  --jade: #00D9A3;
  --jade-glow: rgba(0, 217, 163, 0.3);
  --jade-subtle: rgba(0, 217, 163, 0.12);

  /* 荧光：琥珀 */
  --amber: #FFB800;
  --amber-glow: rgba(255, 184, 0, 0.25);

  /* 荧光：玫瑰 */
  --rose: #FF6B8A;
  --rose-glow: rgba(255, 107, 138, 0.25);

  /* 文字 */
  --text: #FFFFFF;
  --text-soft: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.4);

  /* 阴影：深色发光 */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 24px rgba(0, 217, 163, 0.15);

  /* 圆角 */
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-full: 999px;

  /* 动画 */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-fast: 200ms;
  --duration-normal: 400ms;
  --duration-slow: 800ms;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--night);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   星空背景（纯 CSS 动态）
   ============================================================ */
.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.stars::before {
  content: '';
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 20%, rgba(0,217,163,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 80%, rgba(255,184,0,0.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 90% 10%, rgba(255,107,138,0.4) 0%, transparent 100%);
  background-size: 200px 200px;
  animation: twinkle 8s ease-in-out infinite;
}

.stars::after {
  content: '';
  position: absolute;
  width: 150%;
  height: 150%;
  bottom: -50%;
  right: -25%;
  background:
    radial-gradient(ellipse at 60% 40%, rgba(0, 217, 163, 0.03) 0%, transparent 50%);
  animation: nebula 20s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

@keyframes nebula {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-5%, 5%) scale(1.1); }
}

/* ============================================================
   容器
   ============================================================ */
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 24px 20px;
  position: relative;
}

/* ============================================================
   头部
   ============================================================ */
.header {
  text-align: center;
  padding: 48px 0 40px;
  position: relative;
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-full);
  border: 1px solid var(--glass-border);
  font-size: 13px;
  color: var(--jade);
  font-weight: 500;
  margin-bottom: 24px;
  box-shadow: var(--shadow-glow);
}

.header-badge::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--jade);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--jade);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px var(--jade); }
  50% { opacity: 0.7; transform: scale(0.9); box-shadow: 0 0 20px var(--jade); }
}

.header h1 {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--text) 0%, var(--jade) 50%, var(--amber) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-sub {
  font-size: 16px;
  color: var(--text-soft);
  letter-spacing: 0.02em;
}

/* ============================================================
   琉璃卡片（核心组件）
   ============================================================ */
.glass-card {
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  padding: 24px;
  position: relative;
  overflow: hidden;
  transition: all var(--duration-normal) var(--ease-out);
  box-shadow: var(--shadow-md);
}

.glass-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}

.glass-card::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(0, 217, 163, 0.05) 0%, transparent 40%);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--duration-normal);
}

.glass-card:hover {
  transform: translateY(-4px);
  border-color: var(--glass-border-strong);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}

.glass-card:hover::after {
  opacity: 1;
}

.glass-card:active {
  transform: translateY(-1px) scale(0.99);
  transition-duration: var(--duration-fast);
}

/* ============================================================
   手机模拟器
   ============================================================ */
.phone {
  background: linear-gradient(145deg, #2a2a35, #1a1a22);
  border-radius: 40px;
  padding: 12px;
  box-shadow:
    0 0 0 2px rgba(255, 255, 255, 0.05),
    0 24px 64px rgba(0, 0, 0, 0.6),
    0 8px 16px rgba(0, 0, 0, 0.4);
}

.phone-screen {
  background: var(--night);
  border-radius: 32px;
  overflow: hidden;
  min-height: 700px;
  position: relative;
}

/* ============================================================
   状态栏
   ============================================================ */
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  font-size: 14px;
  font-weight: 600;
}

/* ============================================================
   大标题区域
   ============================================================ */
.hero {
  padding: 20px 24px;
}

.hero-date {
  font-size: 72px;
  font-weight: 100;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--text);
  text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.hero-month {
  font-size: 16px;
  color: var(--text-soft);
  font-weight: 500;
}

.hero-tag {
  padding: 6px 16px;
  background: var(--jade-subtle);
  color: var(--jade);
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--radius-full);
  border: 1px solid rgba(0, 217, 163, 0.2);
  box-shadow: 0 0 16px rgba(0, 217, 163, 0.1);
}

/* ============================================================
   天气卡片 — 深色琉璃
   ============================================================ */
.weather-card {
  margin: 20px 24px;
  padding: 28px;
  background: linear-gradient(135deg, var(--night-card) 0%, var(--night-elevated) 100%);
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}

.weather-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, var(--amber-glow) 0%, transparent 60%);
  animation: float 8s ease-in-out infinite;
}

.weather-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 184, 0, 0.3), transparent);
}

@keyframes float {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, 10px); }
}

.weather-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #FFD700, #FF8C00);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(255, 184, 0, 0.4), 0 0 20px rgba(255, 184, 0, 0.2);
}

.weather-temp {
  font-size: 56px;
  font-weight: 100;
  line-height: 1;
  text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
}

.weather-desc {
  font-size: 16px;
  color: var(--text-soft);
  margin-top: 12px;
}

.weather-meta {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  font-size: 14px;
  color: var(--text-muted);
}

/* ============================================================
   功能卡片 — 琉璃质感
   ============================================================ */
.cards {
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.feature-card {
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all var(--duration-fast) var(--ease-out);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

.feature-card:hover {
  transform: translateX(4px);
  border-color: var(--glass-border-strong);
  background: var(--glass-strong);
  box-shadow: var(--shadow-md);
}

.feature-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}

.feature-icon.jade {
  background: var(--jade-subtle);
  color: var(--jade);
  box-shadow: 0 0 20px rgba(0, 217, 163, 0.2);
}

.feature-icon.amber {
  background: rgba(255, 184, 0, 0.1);
  color: var(--amber);
  box-shadow: 0 0 20px rgba(255, 184, 0, 0.15);
}

.feature-icon.rose {
  background: rgba(255, 107, 138, 0.1);
  color: var(--rose);
  box-shadow: 0 0 20px rgba(255, 107, 138, 0.15);
}

.feature-content {
  flex: 1;
}

.feature-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
}

.feature-desc {
  font-size: 14px;
  color: var(--text-muted);
}

.feature-arrow {
  color: var(--text-muted);
  font-size: 20px;
  transition: all var(--duration-fast);
}

.feature-card:hover .feature-arrow {
  transform: translateX(4px);
  color: var(--jade);
}

/* ============================================================
   进度条 — 荧光流动
   ============================================================ */
.progress-section {
  margin: 24px;
  padding: 24px;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-md);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.progress-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.progress-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--jade);
  text-shadow: 0 0 20px var(--jade-glow);
}

.progress-track {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--jade), #00B888);
  border-radius: 3px;
  position: relative;
  width: 67%;
  box-shadow: 0 0 12px var(--jade-glow);
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 40px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3));
  animation: shimmer 2.5s ease-in-out infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-40px); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateX(200px); opacity: 0; }
}

/* ============================================================
   底部导航 — 悬浮琉璃
   ============================================================ */
.bottom-nav {
  position: absolute;
  bottom: 24px;
  left: 24px;
  right: 24px;
  background: var(--glass-strong);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border-radius: var(--radius-full);
  border: 1px solid var(--glass-border-strong);
  box-shadow: var(--shadow-lg);
  padding: 12px 24px;
  display: flex;
  justify-content: space-around;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  transition: all var(--duration-fast) var(--ease-out);
  cursor: pointer;
  position: relative;
}

.nav-item.active {
  color: var(--jade);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--jade-subtle);
  border-radius: var(--radius-full);
  z-index: -1;
  box-shadow: 0 0 20px rgba(0, 217, 163, 0.15);
}

.nav-item:not(.active) {
  color: var(--text-muted);
}

.nav-item:hover:not(.active) {
  color: var(--text-soft);
  background: rgba(255, 255, 255, 0.04);
}

.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; font-weight: 500; }

/* ============================================================
   按钮组
   ============================================================ */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 24px;
}

.btn {
  padding: 18px 28px;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width var(--duration-normal), height var(--duration-normal);
}

.btn:active::before {
  width: 300px;
  height: 300px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--jade), #00B888);
  color: var(--night);
  box-shadow: 0 4px 20px var(--jade-glow), 0 0 20px rgba(0, 217, 163, 0.2);
}

.btn-primary:hover {
  box-shadow: 0 8px 32px var(--jade-glow), 0 0 32px rgba(0, 217, 163, 0.3);
  transform: translateY(-2px);
}

.btn-glass {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
}

.btn-glass:hover {
  background: var(--glass-strong);
  border-color: var(--glass-border-strong);
  box-shadow: var(--shadow-md);
}

/* ============================================================
   标签
   ============================================================ */
.tags {
  display: flex;
  gap: 12px;
  padding: 0 24px;
  flex-wrap: wrap;
}

.tag {
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 500;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: var(--text-soft);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
}

.tag:hover {
  background: var(--glass-strong);
  border-color: var(--jade);
  color: var(--jade);
}

.tag.active {
  background: var(--jade);
  color: var(--night);
  border-color: var(--jade);
  box-shadow: 0 4px 20px var(--jade-glow);
}

/* ============================================================
   输入框
   ============================================================ */
.input-section {
  padding: 0 24px;
}

.input-field {
  width: 100%;
  padding: 18px 24px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  font-size: 16px;
  color: var(--text);
  transition: all var(--duration-fast) var(--ease-out);
  outline: none;
}

.input-field::placeholder {
  color: var(--text-muted);
}

.input-field:focus {
  border-color: var(--jade);
  box-shadow: 0 0 0 4px var(--jade-glow);
  background: var(--glass-strong);
}

/* ============================================================
   特性网格
   ============================================================ */
.features-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.feature-box {
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  padding: 28px;
  text-align: center;
  transition: all var(--duration-fast) var(--ease-out);
  box-shadow: var(--shadow-sm);
}

.feature-box:hover {
  transform: translateY(-4px);
  border-color: var(--glass-border-strong);
  box-shadow: var(--shadow-md);
}

.feature-box-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  background: var(--jade-subtle);
  color: var(--jade);
  box-shadow: 0 0 24px rgba(0, 217, 163, 0.15);
}

.feature-box-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.feature-box-desc {
  font-size: 13px;
  color: var(--text-muted);
}

/* ============================================================
   分隔
   ============================================================ */
.section {
  margin-bottom: 48px;
}

.section-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--text);
}

.section-title::before {
  content: '';
  width: 4px;
  height: 28px;
  background: linear-gradient(180deg, var(--jade), var(--amber));
  border-radius: 2px;
  box-shadow: 0 0 12px var(--jade-glow);
}

/* ============================================================
   入场动画
   ============================================================ */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 20px var(--jade-glow); }
  50% { box-shadow: 0 0 40px var(--jade-glow); }
}

.animate-fade-up {
  animation: fadeInUp 0.8s var(--ease-out) forwards;
}

.animate-scale-in {
  animation: scaleIn 0.6s var(--ease-out) forwards;
}

.delay-1 { animation-delay: 0.1s; opacity: 0; }
.delay-2 { animation-delay: 0.2s; opacity: 0; }
.delay-3 { animation-delay: 0.3s; opacity: 0; }
.delay-4 { animation-delay: 0.4s; opacity: 0; }
.delay-5 { animation-delay: 0.5s; opacity: 0; }

/* ============================================================
   页脚
   ============================================================ */
.footer {
  text-align: center;
  padding: 48px 0 32px;
  color: var(--text-muted);
  font-size: 14px;
}

.footer-logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-soft);
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
}
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">
