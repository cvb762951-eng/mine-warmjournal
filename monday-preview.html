<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周一课程预览</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="performance.css">
  <link rel="stylesheet" href="styles.css">
  <style>html,body{height:auto;overflow:auto}body{padding:16px 0;background:#e7e2d8}.preview{width:min(100%,395px);margin:auto;background:#f7f4ec;min-height:100vh}.preview-note{margin:0;padding:12px 16px;background:#efeadf;color:#7b756b;font-size:10px;line-height:1.55;text-align:center}.course-page{padding-bottom:30px}</style>
</head>
<body>
  <main class="preview">
    <p class="preview-note">日期模拟预览 · 2026年9月7日 · 第1周周一<br>课程数据来自你提供的班级课表。</p>
    <section class="course-page">
      <section class="course-hero">
        <span class="course-kicker">2026–2027 学年第一学期</span>
        <div><h1>第 1 周</h1><p>9月7日 – 9月11日 · 单周</p></div>
        <div class="course-week-nav"><button disabled aria-label="上一周"><span class="material-symbols-outlined">chevron_left</span></button><button aria-label="下一周"><span class="material-symbols-outlined">chevron_right</span></button></div>
      </section>
      <div class="course-day-tabs" aria-label="选择上课日期">
        <button class="course-day-tab active"><b>周一</b><small>09/07</small><i>5</i></button><button class="course-day-tab"><b>周二</b><small>09/08</small><i>1</i></button><button class="course-day-tab"><b>周三</b><small>09/09</small><i>2</i></button><button class="course-day-tab"><b>周四</b><small>09/10</small><i>1</i></button><button class="course-day-tab"><b>周五</b><small>09/11</small><i>1</i></button>
      </div>
      <button type="button" class="today-courses"><span class="material-symbols-outlined">calendar_month</span><span><strong>今天 5 门课程<small>第 1 教学周 · 还有 4 门课</small></strong><em>下一节 · 08:00–09:40 · 智能制造技术基础</em></span><span class="material-symbols-outlined course-open-arrow">arrow_forward</span></button>
      <section class="course-agenda">
        <header><div><span class="course-kicker">TODAY'S CLASSES</span><h2>周一 · 9月7日</h2></div><small>5 门课程</small></header>
        <div class="course-list">
          <button class="course-row course-tone-sage"><span class="course-period"><b>1</b><small>– 2 节</small></span><span class="course-copy"><strong>智能制造技术基础</strong><small><time>08:00–09:40</time> · 教三楼213 · 乔东平</small></span><span class="material-symbols-outlined course-edit-mark">edit</span></button>
          <button class="course-row course-tone-ochre"><span class="course-period"><b>3</b><small>– 4 节</small></span><span class="course-copy"><strong>形势与政策5</strong><small><time>10:00–11:40</time> · 教三楼104 · 牛纪凤</small></span><span class="material-symbols-outlined course-edit-mark">edit</span></button>
          <button class="course-row course-tone-terracotta"><span class="course-period"><b>5</b><small>– 6 节</small></span><span class="course-copy"><strong>智能生产计划与控制</strong><small><time>14:30–16:10</time> · 教一楼218 · 张丽科</small></span><span class="material-symbols-outlined course-edit-mark">edit</span></button>
          <button class="course-row course-tone-plum"><span class="course-period"><b>7</b><small>– 8 节</small></span><span class="course-copy"><strong>毛泽东思想和中国特色社会主义理论体系概论</strong><small><time>16:30–18:10</time> · 教二楼109 · 聂海杰</small></span><span class="material-symbols-outlined course-edit-mark">edit</span></button>
          <button class="course-row course-tone-blue"><span class="course-period"><b>9</b><small>– 10 节</small></span><span class="course-copy"><strong>科技文献检索</strong><small><time>19:30–21:10</time> · 教三楼205 · 聂钰洪</small></span><span class="material-symbols-outlined course-edit-mark">edit</span></button>
        </div>
      </section>
      <p class="course-tip">正式 App 中点击课程卡片即可修改名称、教师和教室。</p>
    </section>
  </main>
</body>
</html>
