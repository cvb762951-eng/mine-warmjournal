apply plugin: 'com.android.application'

// 签名配置
// ---------
// 优先级（从高到低）：
// 1) 环境变量（GitHub Actions 等 CI 用）：四个变量都齐、且密钥文件存在时才生效 ——
//    ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
// 2) 本机存在 android/keystore.properties 时，使用其中指定的密钥（该文件已加入 .gitignore，不提交）。
// 3) 否则若存在 app/mine-update.keystore，则用这个密钥（自用安装；该文件不入库）。
// 4) 都没有时，自动回退到 Android 默认 debug 签名，保证任何人都能构建。
//
// ⚠️ 这里只读环境变量，绝不把口令写进本文件或任何仓库文件。
def envKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def envKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def envKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasEnvSigning = envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword
        && file(envKeystorePath).exists()
if (envKeystorePath && !file(envKeystorePath).exists()) {
    logger.warn("ANDROID_KEYSTORE_PATH 指向的文件不存在，已忽略环境变量签名：${envKeystorePath}")
}

def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def devKeystoreFile = file('mine-update.keystore')
def hasDevKeystore = devKeystoreFile.exists()

android {
    namespace = "com.mine.focus"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        // CI 签名：口令只来自环境变量，不落盘到仓库。
        if (hasEnvSigning) {
            envSigning {
                storeFile file(envKeystorePath)
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
        if (hasDevKeystore) {
            // 自用密钥：仓库内不自带，仅本机存在时启用。
            devSigning {
                storeFile devKeystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        // 自定义密钥：仅当本机存在 keystore.properties 时启用。
        if (hasReleaseKeystore) {
            customSigning {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.mine.warmjournal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 发版连同 package.json、app-updater.js、index.html 的 ?v=、release-notes.js 一起改。
        versionCode 132
        versionName "1.1.31"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             // 额外排除 *.map：source map 只在浏览器开发者工具里调试用，装机无用（约 4.8MB）。
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map'
        }
    }
    buildTypes {
        debug {
            // 优先级：环境变量（CI）> 本地密钥 > 自用密钥 > Android 默认 debug 签名
            if (hasEnvSigning) {
                signingConfig signingConfigs.envSigning
            } else if (hasReleaseKeystore) {
                signingConfig signingConfigs.customSigning
            } else if (hasDevKeystore) {
                signingConfig signingConfigs.devSigning
            }
        }
        release {
            if (hasEnvSigning) {
                signingConfig signingConfigs.envSigning
            } else if (hasReleaseKeystore) {
                signingConfig signingConfigs.customSigning
            } else if (hasDevKeystore) {
                signingConfig signingConfigs.devSigning
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 2026-10-10：视频重新编码（剪时长 + 裁画面 → 新的 mp4）。
    // 这三个制品只有原生代码用得到，网页层不感知；改动它们必须重装 App，不能热更新。
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
