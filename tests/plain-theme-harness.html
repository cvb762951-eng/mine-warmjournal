<!doctype html>
<meta charset="utf-8">
<title>plain theme multi-frame harness</title>
<style>
  html, body { margin: 0; background: #cfd6e2; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 13px; font-weight: 700; color: #2c3440; margin: 0 0 6px 2px; }
  iframe { display: block; width: 390px; height: 844px; border: 0; background: #fff; border-radius: 18px; }
</style>
<div class="row">
  <figure><figcaption>今日</figcaption><iframe src="/www/index.html"></iframe></figure>
  <figure><figcaption>随手拍</figcaption><iframe src="/www/index.html"></iframe></figure>
  <figure><figcaption>日记</figcaption><iframe src="/www/index.html"></iframe></figure>
</div>
<div class="row">
  <figure><figcaption>账本</figcaption><iframe src="/www/index.html"></iframe></figure>
  <figure><figcaption>日历</figcaption><iframe src="/www/index.html"></iframe></figure>
  <figure><figcaption>我的</figcaption><iframe src="/www/index.html"></iframe></figure>
</div>
