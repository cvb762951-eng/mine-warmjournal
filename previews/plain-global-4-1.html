<!doctype html>
<html lang="zh-CN" data-theme="plain">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>清简 §4.1 全局 · 预览</title>
<!-- 与 App 相同的样式链：styles.css → performance.css → themes.css → themes-plain.css -->
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../performance.css">
<link rel="stylesheet" href="../themes.css"><link rel="stylesheet" href="../themes-plain.css">
<style>body{margin:0}.phone-shell{position:relative;width:min(100%,420px);height:100dvh;margin:0 auto;overflow:hidden}
#app{height:100%;overflow:auto;padding:16px 14px 100px}.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #4F76BD;background:#fff;color:#4F76BD}
.opus{width:100%;height:760px;border:1px solid rgba(85,96,108,.2);border-radius:14px;margin-top:14px}</style>
</head>
<body>
<div class="phone-shell">
  <main id="app"><section class="view today-view">
    <h2>§4.1 全局（App 同一份 CSS）</h2>
    <p>点底栏看滑块 260ms 滑过去 + 图标 .92→1；「弹层」看冷墨 32% 实色遮罩；「Toast」看实色墨块上移 8px。</p>
    <div class="ctl"><button id="sheet">弹层</button><button id="toast-btn">Toast</button><button id="enter">页面入场</button></div>
    <h3>对照：Opus #36 原版演示</h3>
    <iframe class="opus" loading="lazy" src="https://raw.githack.com/cvb762951-eng/mine-warmjournal/cursor/design-upgrade-plan-9c6d/preview/design-upgrade.html"></iframe>
  </section></main>
  <nav id="floating-dock" class="floating-dock">
    <button class="dock-btn active"><span class="material-symbols-outlined">edit</span><small>Today</small></button>
    <button class="dock-btn"><span class="material-symbols-outlined">event</span><small>Calendar</small></button>
    <button class="dock-btn"><span class="material-symbols-outlined">photo</span><small>Moments</small></button>
    <button class="dock-btn"><span class="material-symbols-outlined">book</span><small>Journal</small></button>
    <button class="dock-btn"><span class="material-symbols-outlined">wallet</span><small>Ledger</small></button>
  </nav>
  <div id="modal-layer" class="modal-layer"><div class="modal"><h3>底部弹层</h3><p>点遮罩关闭</p></div></div>
  <div id="toast" class="toast">已保存</div>
</div>
<script>
const $=s=>document.querySelector(s);
document.querySelectorAll('.dock-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dock-btn').forEach(x=>x.classList.toggle('active',x===b));});
$('#sheet').onclick=()=>$('#modal-layer').classList.add('open');
$('#modal-layer').onclick=e=>{if(e.target.id==='modal-layer')e.target.classList.remove('open')};
$('#toast-btn').onclick=()=>{$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)};
$('#enter').onclick=()=>{const a=$('#app');a.classList.remove('nav-transition');void a.offsetWidth;a.classList.add('nav-transition');setTimeout(()=>a.classList.remove('nav-transition'),300)};
</script>
</body></html>
